name: CI

# Conservative by design (soft launch, one tester). See
# docs/operations/ci-review-and-preview-policy.md for who covers what:
#   - Code review covers logic, privacy, and product intent.
#   - Local `pnpm verify` proves the build before a push; Vercel builds only
#     main and preview/* branches (Core Philosophy §16.6) and deploys
#     production on merge, so GitHub-hosted runs do not build or start the app (the Mac mini runner does build).
#   - This workflow runs the fast contract checks once, when a PR is ready.
# It does not run on pushes to main: the same commit already passed on its PR.
# Draft PRs skip it; marking the PR ready (or running it by hand) triggers it.
# Docs-only PRs pass it after a path check, without installing or verifying.

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The job id stays `build-and-smoke` so any branch rule that names the old
  # check keeps matching. It no longer builds or smoke-tests; see above.
  build-and-smoke:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    # Runs on the Mac mini's own runner (free minutes) when the repo variable
    # CI_RUNNER is "mini". Delete that variable to fall back to GitHub's machines.
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Docs-only PRs (docs/, .claude/, top-level Markdown) pass this required
      # check without installing or verifying: they cannot change the site.
      # Same path list as scripts/vercel-ignore-build.mjs.
      - name: Classify change
        id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -z "$BASE_SHA" ]; then echo "code=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          code=$(git diff --name-only "$BASE_SHA"...HEAD | grep -v -E '^(docs/|\.claude/|[^/]+\.md$)' || true)
          if [ -z "$code" ]; then
            echo "Docs-only change: skipping install and verify."
            echo "code=false" >> "$GITHUB_OUTPUT"
          else
            echo "code=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup pnpm
        if: steps.classify.outputs.code == 'true'
        uses: pnpm/action-setup@v4
        with:
          # Per-runner folder: the Mini runs several runners that would collide on a shared one.
          dest: ${{ runner.temp }}/setup-pnpm

      - name: Setup Node.js
        if: steps.classify.outputs.code == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          # The Mini keeps its pnpm store between runs; only GitHub's fresh machines need the cache.
          cache: ${{ runner.environment == 'github-hosted' && 'pnpm' || '' }}

      - name: Install dependencies
        if: steps.classify.outputs.code == 'true'
        run: pnpm install --frozen-lockfile

      # GitHub-hosted runners skip the build (Vercel owns it there). The Mini's
      # minutes are free, so PRs also prove the production build on the Mini.
      - name: Verify (typecheck + lint + test + checks; build on the Mini only)
        if: steps.classify.outputs.code == 'true'
        run: pnpm verify
        env:
          VERIFY_SKIP_BUILD: ${{ runner.environment == 'github-hosted' && '1' || '' }}
