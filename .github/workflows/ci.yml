name: CI

# Conservative by design (soft launch, one tester). See
# docs/operations/ci-review-and-preview-policy.md for who covers what:
#   - Code review covers logic, privacy, and product intent.
#   - Vercel's own preview build proves `next build` on every PR and deploys
#     production on merge, so this workflow does not build or start the app.
#   - This workflow runs the fast contract checks once, when a PR is ready.
# It does not run on pushes to main: the same commit already passed on its PR.
# Draft PRs skip it; marking the PR ready (or running it by hand) triggers it.

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The job id stays `build-and-smoke` so any branch rule that names the old
  # check keeps matching. It no longer builds or smoke-tests; see above.
  build-and-smoke:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify (typecheck + lint + test + checks; Vercel owns the build)
        run: pnpm verify
        env:
          VERIFY_SKIP_BUILD: "1"
